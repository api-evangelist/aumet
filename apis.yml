aid: aumet
name: Aumet
description: >-
  Aumet is a MENA-based healthtech company building an AI-first procurement and
  pharmacy operating system for healthcare. Its platform connects pharmaceutical
  manufacturers, distributors, and pharmacies through a B2B marketplace and a suite
  of pharmacy software: Pulse (point-of-sale, inventory, and smart reordering for
  individual pharmacies), Chain (multi-branch pharmacy management), and Enterprise
  (solutions for government health systems and hospitals). The platform adds
  AI-powered demand forecasting, procurement automation, price transparency, and
  analytics, and reports serving 12,000+ pharmacies and 1,000+ suppliers across
  Jordan, Egypt, and Saudi Arabia with over $1B in gross merchandise value and
  millions of transactions annually. Aumet is backed by 500 Global and Techstars.
